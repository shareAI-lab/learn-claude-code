name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run Python smoke tests
        run: >-
          python -m pytest
          tests/test_agents_smoke.py
          tests/test_agents_baseline_contract.py
          tests/test_deepagents_track_smoke.py tests/test_deepagents_control_plane.py
          tests/test_deepagents_gating_spike.py
          tests/test_provider_safety.py
          tests/test_stage_track_capability_contract.py
          -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
